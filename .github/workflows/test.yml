name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 测试全部跑在 stub 出来的 Zotero 全局上，不需要装 Zotero
      - name: Run endpoint + manifest tests
        run: node test_bridge.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 打包顺带校验 manifest 声明的图标确实进了包
      - name: Build xpi
        run: python build.py

      - name: Upload xpi
        uses: actions/upload-artifact@v4
        with:
          name: zotero-js-bridge.xpi
          path: zotero-js-bridge.xpi
