name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 测试全部跑在 stub 出来的 Zotero 全局上，不需要装 Zotero
      - name: Run endpoint + manifest tests
        run: node test_bridge.js

      # 这一条才算「测试真的在盯着」：把每处修复逐个改回坏的样子，看测试会不会红。
      # 变异体没被抓住、或者锚点对不上了（跳过），都算失败 —— 静默放过的守卫
      # 就是一条注释。python3 是 runner 自带的，这里只需要它转调 node。
      - name: Tests must catch every mutant
        run: python3 mutate.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 这几个 .py（客户端 / 打包 / 画图标 / 备份体检 / 变异验证）没有单元测试，
      # 至少保证能编译过、import 得动
      - name: Byte-compile the Python client and scripts
        run: |
          python -m py_compile zoterojs.py build.py make_icon.py check_backup.py mutate.py build_llms.py
          python -c "import zoterojs, build, mutate, build_llms"

      # 打包顺带校验 manifest 声明的图标确实进了包
      - name: Build xpi
        run: python build.py

      # build.py 会把 updates.json 刷成 manifest 的版本。刷完还有 diff，说明这文件被
      # 手改过、两边对不上了 —— 那正是"市场显示新版、老用户收不到更新"的成因。
      - name: updates.json 必须和 manifest 同步
        run: |
          if ! git diff --quiet -- updates.json; then
            echo "::error::updates.json 与 manifest 版本不一致，跑一下 python build.py 并提交"
            git diff -- updates.json
            exit 1
          fi

      # llms-full.txt 是 build_llms.py 从 README/docs 拼出来的。它一旦漂了，
      # 模型读到的就是旧文档 —— 而那是**看不出来**的那类错误，没人会去核对一份
      # 拼好的副本。所以和 updates.json 一样，重新生成后必须没有 diff。
      - name: llms-full.txt 必须和源文档同步
        run: |
          python build_llms.py
          if ! git diff --quiet -- llms-full.txt; then
            echo "::error::llms-full.txt 与 README/docs 不一致，跑一下 python build_llms.py 并提交"
            exit 1
          fi

      - name: Upload xpi
        uses: actions/upload-artifact@v7
        with:
          name: zotero-js-bridge.xpi
          path: zotero-js-bridge.xpi
